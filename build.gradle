buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group
base { archivesName = mod_archive }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Test-only agent mod (immersive_smithing_packtest): drives a client into a fresh world, checks smithing data, stages
    // every station and screen for screenshots, writes packtest-result.json and quits. Used by runClient -PsmokeTest
    // and, as the reobfuscated packTestJar, by tools/packtest against a full modpack. Never shipped.
    packTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { immersive_smithing { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeTest') || project.hasProperty('stationBenchmark')) {
                property 'immersive_smithing.packtest.output', file('run/packtest').absolutePath
                // The optional mods put into the run are also checked: their recipes, kept sources and tags.
                property 'immersive_smithing.packtest.expect', [project.hasProperty('compatMods') ? 'spartan,shields,upgrades' : null,
                        project.hasProperty('epicFight') ? 'epicfight' : null,
                        project.hasProperty('epicKnights') ? 'epicknights' : null,
                        project.hasProperty('simplySwords') ? 'simplyswords' : null].findAll().join(',')
                // -PstationBenchmark=<label>: the agent measures the station scenes instead of the smoke test and writes
                // run/packtest/station-benchmark-<label>.json.
                if (project.hasProperty('stationBenchmark')) {
                    property 'immersive_smithing.packtest.benchmark', project.property('stationBenchmark').toString() ?: 'current'
                }
                mods { immersive_smithing_packtest { source sourceSets.packTest } }
            }
        }
        server { args '--nogui' }
        gameTestServer {
            if (epicKnightsSelection().any { it in ['overgeared', 'terrafirma', 'terrafirmagreg'] }) {
                property 'forge.enabledGameTestNamespaces', 'immersive_smithing_coexistence'
            }
            def profile = project.findProperty('gameTestProfile')?.toString()
            if (profile != null && !(profile ==~ /[a-zA-Z0-9_-]+/)) throw new GradleException('gameTestProfile must be a plain label')
            workingDirectory project.file(profile == null ? 'run-gametest' : "run-gametest/profiles/${profile}")
            // The coverage GameTests compare the live catalogs with these checked-in inventories.
            property 'immersive_smithing.manifestDir', file('docs/compatibility/inventory').absolutePath
            // -PregistryDump=ns1,ns2 (or all): RegistryDumpGameTests writes the live registry of those mods to logs/.
            if (project.hasProperty('registryDump')) property 'immersive_smithing.registryDump', project.property('registryDump').toString()
            mods { immersive_smithing { source sourceSets.gameTest } }
        }
    }
}

configurations {
    devRemap { transitive = false }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    // Station overlays (compat/jade). Jade discovers the plugin by annotation; nothing references it otherwise.
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Thrown-weapon quality reads Spartan's projectile type (compat/spartanweaponry, reached only when it is loaded).
    compileOnly fg.deobf("maven.modrinth:spartan-weaponry:${spartan_weaponry_modrinth_id}")

    // Real content mods for the auto-detection GameTests. Never part of a normal build.
    if (project.hasProperty('compatMods')) {
        runtimeOnly fg.deobf("maven.modrinth:spartan-weaponry:${spartan_weaponry_modrinth_id}")
        runtimeOnly fg.deobf("maven.modrinth:spartan-shields:${spartan_shields_modrinth_id}")
        runtimeOnly fg.deobf("maven.modrinth:immersive-armors:${immersive_armors_modrinth_id}")
    }

    // Epic Fight and Simply Swords: the main code reaches them only through data, so only the GameTests compile
    // against them. -PepicFight and -PsimplySwords (alone or together) put the pinned releases into every run.
    gameTestCompileOnly fg.deobf("maven.modrinth:epic-fight:${epic_fight_modrinth_id}")
    gameTestCompileOnly fg.deobf("maven.modrinth:simply-swords:${simply_swords_modrinth_id}")
    if (project.hasProperty('epicFight')) {
        runtimeOnly fg.deobf("maven.modrinth:epic-fight:${epic_fight_modrinth_id}")
    }
    if (project.hasProperty('simplySwords')) {
        // Built with Architectury Loom: SRG mixin targets without a refmap, so remapDevMods finishes the job.
        devRemap fg.deobf("maven.modrinth:simply-swords:${simply_swords_modrinth_id}")
        devRemap fg.deobf("maven.modrinth:architectury-api:${architectury_modrinth_id}")
        devRemap fg.deobf("maven.modrinth:simply-tooltips:${simply_tooltips_modrinth_id}")
        runtimeOnly files(fileTree(layout.buildDirectory.dir('devmods')) { include '*.jar' }).builtBy('remapDevMods')
        runtimeOnly fg.deobf("maven.modrinth:fzzy-config:${fzzy_config_modrinth_id}")
        runtimeOnly "maven.modrinth:kotlin-for-forge:${kotlin_for_forge_modrinth_id}"
    }

    // Epic Knights and its add-ons, pinned in gradle.properties. Immersive Smithing ships their recipes as data, so
    // nothing compiles against them except the GameTests. Every jar goes through remapDevMods: several are built with
    // Architectury Loom (SRG mixin targets, no refmap) and Medieval Boomsticks has an SRG access transformer.
    gameTestCompileOnly fg.deobf("maven.modrinth:epic-knights-shields-armor-and-weapons:${epic_knights_modrinth_id}")
    epicKnightsSelection().each { key ->
        epicKnightsJars(key).each { coordinate -> devRemap fg.deobf(coordinate) }
    }
    if (!epicKnightsSelection().isEmpty()) {
        runtimeOnly files(fileTree(layout.buildDirectory.dir('devmods')) { include '*.jar' }).builtBy('remapDevMods')
    }
}

/**
 * The Epic Knights run profile. -PepicKnights (or =all) is the base mod with every add-on that needs no other large
 * mod; =base is Epic Knights alone; a comma list (=addon,slavic or =all,iceandfire) is the base plus those add-ons. The
 * key iceandfire also loads Ice and Fire and Citadel. FoxRall's Visors is client-only and only joins client runs.
 */
List<String> epicKnightsSelection() {
    if (!project.hasProperty('epicKnights')) return []
    def all = ['addon', 'antique', 'slavic', 'oresalloys', 'darkages', 'openhelms', 'swappable', 'artillery', 'boomsticks',
               'sevenkingdoms']
    def value = project.property('epicKnights').toString().trim()
    def keys = []
    (value.isEmpty() || value == 'true' ? ['all'] : value.split(',').collect { it.trim() }.findAll { !it.isEmpty() }).each { key ->
        if (key == 'all') keys.addAll(all) else if (key != 'base') keys.add(key)
    }
    keys = keys.unique()
    def known = all + ['iceandfire', 'foxrall', 'thirtyyearswar', 'fletchery', 'japanese', 'ingots', 'boomsticks-release',
                       'bettercombat', 'rework', 'overgeared', 'terrafirma', 'terrafirmagreg']
    keys.each { if (!known.contains(it)) throw new GradleException("Unknown -PepicKnights key '${it}'; known: ${known}") }
    if (keys.contains('boomsticks') && keys.contains('boomsticks-release')) {
        throw new GradleException('Select only one Medieval Boomsticks version: boomsticks (alpha) or boomsticks-release.')
    }
    if (keys.count { it in ['overgeared', 'terrafirma', 'terrafirmagreg'] } > 1) {
        throw new GradleException('Manufacturing bridges must be tested separately: overgeared, terrafirma, terrafirmagreg.')
    }
    if (project.hasProperty('epicFight') && keys.any { it in ['bettercombat', 'rework'] }) {
        throw new GradleException('Test Epic Fight and Better Combat in separate profiles.')
    }
    return ['base'] + keys
}

List<String> epicKnightsJars(String key) {
    def curse = { String pinned -> def (slug, file) = pinned.split(':'); "curse.maven:${slug}:${file}".toString() }
    switch (key) {
        case 'base': return ["maven.modrinth:epic-knights-shields-armor-and-weapons:${epic_knights_modrinth_id}".toString(),
                             "maven.modrinth:architectury-api:${architectury_modrinth_id}".toString(),
                             "maven.modrinth:cloth-config:${cloth_config_modrinth_id}".toString()]
        case 'addon': return ["maven.modrinth:epic-knights-addon:${ek_addon_modrinth_id}".toString()]
        case 'antique': return ["maven.modrinth:epic-knights-antique-legacy:${ek_antique_legacy_modrinth_id}".toString()]
        case 'slavic': return ["maven.modrinth:epic-knights-slavic-armory:${ek_slavic_armory_modrinth_id}".toString()]
        case 'sevenkingdoms': return ["maven.modrinth:epic-knights-of-the-seven-kingdoms:${ek_seven_kingdoms_modrinth_id}".toString()]
        case 'oresalloys': return [curse(ek_ores_and_alloys_curse)]
        case 'darkages': return [curse(ek_dark_ages_curse)]
        case 'openhelms': return [curse(ek_open_helms_curse)]
        case 'swappable': return [curse(ek_swappable_helms_curse)]
        case 'artillery': return [curse(ek_artillery_curse)]
        case 'boomsticks': return [curse(ek_boomsticks_curse), "maven.modrinth:geckolib:${geckolib_modrinth_id}".toString()]
        case 'boomsticks-release': return [curse(ek_boomsticks_release_curse), "maven.modrinth:geckolib:${geckolib_modrinth_id}".toString()]
        case 'thirtyyearswar': return [curse(ek_thirty_years_war_curse)]
        case 'fletchery': return [curse(ek_fletchery_curse)]
        case 'japanese': return [curse(ek_japanese_armory_curse)]
        case 'ingots': return [curse(ek_ingots_addition_curse)]
        case 'bettercombat': return ["maven.modrinth:better-combat:${better_combat_modrinth_id}".toString(),
                                     "maven.modrinth:playeranimator:${playeranimator_modrinth_id}".toString()]
        case 'rework': return epicKnightsJars('bettercombat') + [curse(ek_better_combat_rework_curse)]
        case 'overgeared': return [curse(ek_overgeared_bridge_curse), "maven.modrinth:overgeared:${overgeared_modrinth_id}".toString()]
        case 'terrafirma': return [curse(ek_terrafirma_bridge_curse)] + epicKnightsTerrafirmaDependencies()
        case 'terrafirmagreg': return [curse(ek_terrafirmagreg_bridge_curse),
                                      "maven.modrinth:gregtechceu-modern:${gtceu_modrinth_id}".toString()] + epicKnightsTerrafirmaDependencies()
        case 'iceandfire': return [curse(ek_ice_and_fire_curse), "maven.modrinth:ice-and-fire-dragons:${ice_and_fire_modrinth_id}".toString(),
                                   "maven.modrinth:citadel:${citadel_modrinth_id}".toString()]
        case 'foxrall': return gradle.startParameter.taskNames.any { it.toLowerCase().contains('client') } ? [curse(ek_foxralls_visors_curse)] : []
        default: throw new GradleException("Unknown Epic Knights key ${key}")
    }
}

List<String> epicKnightsTerrafirmaDependencies() {
    return epicKnightsJars('antique') + ["maven.modrinth:terrafirmacraft:${terrafirmacraft_modrinth_id}".toString(),
                                        "maven.modrinth:patchouli:${patchouli_modrinth_id}".toString()]
}

// Dev runs only: rewrites the SRG member names that fg.deobf leaves in mixin annotations and access transformers.
tasks.register('remapDevMods', Exec) {
    dependsOn 'createSrgToMcp'
    def out = layout.buildDirectory.dir('devmods')
    inputs.files(configurations.devRemap)
    inputs.file('tools/devmods/remap_srg_strings.py')
    outputs.dir(out)
    onlyIf { !configurations.devRemap.dependencies.isEmpty() }
    doFirst {
        delete out
        commandLine(['python3', file('tools/devmods/remap_srg_strings.py').absolutePath,
                     layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath,
                     out.get().asFile.absolutePath] + configurations.devRemap.files*.absolutePath)
    }
}
tasks.matching { it.name.startsWith('prepareRun') }.configureEach { dependsOn 'remapDevMods' }

// Upstream conflict: Epic Knights: Addon 2.6 and Epic Knights: Ice and Fire 1.1 both name their AutoConfig
// "epicknightsaddon", so each overwrites the other's config/epicknightsaddon/*.json5 and the next launch with both fails
// (NullPointerException in AutoConfig). Dev runs that load both start from a fresh folder; players need one or the other.
tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
    doFirst {
        def keys = epicKnightsSelection()
        if (keys.contains('addon') && keys.contains('iceandfire')) {
            ['run', 'run-gametest'].each { dir -> delete file("${dir}/config/epicknightsaddon") }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                      mod_authors: mod_authors, minecraft_version_range: minecraft_version_range,
                      forge_version_range: forge_version_range, loader_version_range: loader_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('processPackTestResources', ProcessResources).configure {
    inputs.properties mod_version: mod_version, mod_license: mod_license
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version, mod_license: mod_license }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('packTestJar', Jar) {
    archiveClassifier = 'packtest'
    from sourceSets.packTest.output
    exclude "${mod_id}.refmap.json"
    manifest.attributes('Implementation-Title': 'immersive_smithing_packtest', 'Implementation-Version': mod_version)
}

reobf {
    // The agent calls inherited Minecraft methods on Immersive Smithing types, so reobf must see the main classes.
    packTestJar { libraries.from(sourceSets.packTest.compileClasspath) }
}

tasks.named('packTestJar') { finalizedBy 'reobfPackTestJar' }

tasks.named('jar', Jar).configure {
    manifest.attributes('Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
                        'Specification-Version': '1', 'Implementation-Title': project.name,
                        'Implementation-Version': mod_version, 'Implementation-Vendor': mod_authors,
                        'MixinConfigs': "${mod_id}.mixins.json")
    finalizedBy 'reobfJar'
}
